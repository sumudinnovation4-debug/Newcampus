<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camplugie — Sell</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <header class="cp-page-header">
    <a class="icon-btn" href="home.html" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </a>
    <h1>List something</h1>
    <span style="width:38px"></span>
  </header>

  <form class="form-wrap" id="listingForm">
    <div class="type-toggle">
      <button type="button" class="btn active" data-type="product">📦 Product</button>
      <button type="button" class="btn" data-type="service">🛠 Service</button>
    </div>

    <div class="form-group">
      <label class="form-label">Photos</label>
      <div class="upload-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Tap to add up to 5 photos
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Title</label>
      <input class="form-input" placeholder="e.g. CHM 101 Textbook, 3rd Ed." required>
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" placeholder="Condition, what's included, why you're selling…"></textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Price (₦)</label>
      <input class="form-input" type="number" placeholder="0.00">
    </div>

    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select">
        <option>Textbooks</option>
        <option>Electronics</option>
        <option>Fashion</option>
        <option>Food</option>
        <option>Services</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Pickup location</label>
      <input class="form-input" placeholder="e.g. Awo Hall gate">
    </div>

    <button type="submit" class="form-submit">Post listing</button>
  </form>

</div>

<nav class="cp-bottom-nav">
  <a class="cp-nav-item" href="home.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </a>
  <a class="cp-nav-item" href="yard.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
    Yard
  </a>
  <button class="cp-nav-fab" data-tab="create">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <a class="cp-nav-item" href="notifications.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    Notifications
  </a>
  <a class="cp-nav-item" href="profile.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profile
  </a>
</nav>

<script src="js/create.js"></script>
</body>
</html>
