<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camplugie — Sign in</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">

  <div class="auth-logo"><img src="assets/camplugie-mark.png" alt="Camplugie"></div>
  <h1 id="authTitle">Welcome back</h1>
  <p class="auth-sub" id="authSub">Log in to your campus marketplace</p>

  <div class="auth-tabs">
    <button class="auth-tab active" data-view="login">Log in</button>
    <button class="auth-tab" data-view="signup">Sign up</button>
  </div>

  <button type="button" class="landing-google-lg" id="googleBtn" style="color:var(--brand-dark); box-shadow:none; border:1px solid var(--border);">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6 29.6 4 24 4c-7.3 0-13.6 4.1-16.7 10.1z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.4-2 14.1-5.4l-6.5-5.5C29.6 34.8 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-7.9l-6.6 5.1C9.1 39.6 15.9 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.7 2.1-2.1 3.9-3.9 5.2l6.5 5.5C39.8 40.3 44 33.7 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Continue with Google
  </button>

  <div style="display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--text3); font-size:12px;">
    <div style="flex:1; height:1px; background:var(--border)"></div>
    or
    <div style="flex:1; height:1px; background:var(--border)"></div>
  </div>

  <!-- LOGIN -->
  <form class="auth-view active" id="loginView">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" placeholder="you@student.edu" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="password-field">
        <input class="form-input" type="password" placeholder="••••••••" required>
        <button type="button" class="password-toggle" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="form-submit">Log in</button>
  </form>

  <!-- SIGN UP -->
  <form class="auth-view" id="signupView">
    <div class="form-group">
      <label class="form-label">Full name</label>
      <input class="form-input" type="text" placeholder="Chidinma Okoro" required>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" placeholder="you@student.edu" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="password-field">
        <input class="form-input" type="password" placeholder="At least 8 characters" required>
        <button type="button" class="password-toggle" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Your university</label>

      <!-- Shown before a university is picked -->
      <div class="uni-picker" id="uniPicker">
        <div class="uni-picker-input" id="uniPickerInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="uniSearch" placeholder="Type to search your school…" autocomplete="off">
        </div>
        <div class="uni-list" id="uniList"></div>
      </div>

      <!-- Shown after a university is picked -->
      <div class="uni-locked" id="uniLocked" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="name" id="uniLockedName"></span>
        <button type="button" id="uniChange" style="background:none;border:none;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer">Change</button>
      </div>

      <div class="field-hint">This is permanent — you'll only see feed posts and marketplace listings from this school, and it can't be changed after you sign up.</div>
      <input type="hidden" id="uniIdField" required>
    </div>

    <button type="submit" class="form-submit">Create account</button>
  </form>

  <p class="auth-foot" id="authFoot">Don't have an account? <a href="#" id="switchToSignup">Sign up</a></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-init.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
