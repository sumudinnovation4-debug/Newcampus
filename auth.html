<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camplugie — Sign in</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-shell">

  <div class="auth-logo"><img src="assets/camplugie-mark.png" alt="Camplugie"></div>
  <h1 id="authTitle">Welcome back</h1>
  <p class="auth-sub" id="authSub">Log in to your campus marketplace</p>

  <div class="auth-tabs">
    <button class="auth-tab active" data-view="login">Log in</button>
    <button class="auth-tab" data-view="signup">Sign up</button>
  </div>

  <!-- LOGIN -->
  <form class="auth-view active" id="loginView">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" placeholder="you@student.edu" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="password-field">
        <input class="form-input" type="password" placeholder="••••••••" required>
        <button type="button" class="password-toggle" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="form-submit">Log in</button>
  </form>

  <!-- SIGN UP -->
  <form class="auth-view" id="signupView">
    <div class="form-group">
      <label class="form-label">Full name</label>
      <input class="form-input" type="text" placeholder="Chidinma Okoro" required>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" placeholder="you@student.edu" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="password-field">
        <input class="form-input" type="password" placeholder="At least 8 characters" required>
        <button type="button" class="password-toggle" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Your university</label>

      <!-- Shown before a university is picked -->
      <div class="uni-picker" id="uniPicker">
        <div class="uni-picker-input" id="uniPickerInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="uniSearch" placeholder="Type to search your school…" autocomplete="off">
        </div>
        <div class="uni-list" id="uniList"></div>
      </div>

      <!-- Shown after a university is picked -->
      <div class="uni-locked" id="uniLocked" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="name" id="uniLockedName"></span>
        <button type="button" id="uniChange" style="background:none;border:none;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer">Change</button>
      </div>

      <div class="field-hint">This is permanent — you'll only see feed posts and marketplace listings from this school, and it can't be changed after you sign up.</div>
      <input type="hidden" id="uniIdField" required>
    </div>

    <button type="submit" class="form-submit">Create account</button>
  </form>

  <p class="auth-foot" id="authFoot">Don't have an account? <a href="#" id="switchToSignup">Sign up</a></p>

</div>

<script src="js/auth.js"></script>
</body>
</html>
